<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0a" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Digital card — Arda Kurucu, Visual Creative." />
    <meta property="og:title" content="Arda Kurucu — Digital card" />
    <meta property="og:description" content="Videography, photography and design. Save my contact or start a project." />
    <title>Arda Kurucu — Digital card</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23171817'/%3E%3Cpath d='M14 48 27 14h10l13 34H39l-2-7H26l-2 7Zm15-16h6l-3-9Z' fill='%23f1eee8'/%3E%3C/svg%3E" />
    <!-- Switzer: ITF Free Font License via Fontshare. Newsreader: SIL OFL via Google Fonts. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" />
    <link rel="stylesheet" href="/src/card/card.css" />
  </head>
  <body>
    <div class="card">
      <div class="reel" aria-hidden="true">
        <!-- One short, muted, looping reel (Tanabay & Sasha + vasiyet.) so phones autoplay it reliably. -->
        <video src="/media/portfolio/video/card-reel.mp4" poster="/media/portfolio/video/card-reel.jpg" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
      </div>

      <header class="bar">
        <a href="/" class="logo-link" aria-label="Arda Kurucu — portfolio">
          <svg viewBox="300 290 610 433" class="logo" aria-hidden="true"><path fill="currentColor" d="M301 719L408 499L509 705V374H554V597L646 499H731L792 624L851 499H899L791 721L691 516L610 602L707 719H649L554 603V719H468L408 597L349 719Z" /><circle cx="869" cy="331" r="39" fill="#6e0000" /></svg>
        </a>
        <span class="mono rec"><i></i>Showreel</span>
      </header>

      <main class="content">
        <p class="mono meta">Digital card</p>
        <h1>Arda Kurucu<em>moving images.</em></h1>
        <p class="role">Visual Creative — videography, photography &amp; design.</p>

        <nav class="rows" aria-label="Contact options">
          <a href="/#work"><b><span class="mono">01</span>Selected works</b><svg class="ar" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10" /></svg></a>
          <a href="/project/"><b><span class="mono">02</span>Start a project</b><svg class="ar" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10" /></svg></a>
          <a href="https://wa.me/905321710401" target="_blank" rel="noreferrer"><b><span class="mono">03</span>WhatsApp</b><svg class="ar" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10" /></svg></a>
          <a href="https://www.instagram.com/kurucuvisuals/" target="_blank" rel="noreferrer"><b><span class="mono">04</span>Instagram</b><svg class="ar" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10" /></svg></a>
        </nav>

        <button type="button" class="save" id="save">Save contact <svg class="ar" viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6" /></svg></button>
        <button type="button" class="qr-toggle mono" id="qr-open">Tap to show QR code</button>
      </main>

      <div class="qr" id="qr" role="dialog" aria-modal="true" aria-labelledby="qr-title" hidden>
        <div class="qr-box">
          <p class="mono" id="qr-title">Scan to open this card</p>
          <canvas id="qr-canvas" aria-label="QR code for this card"></canvas>
          <p class="qr-name">Arda Kurucu</p>
          <button type="button" class="mono qr-close" id="qr-close">Close ×</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/card/card.js"></script>
  </body>
</html>
