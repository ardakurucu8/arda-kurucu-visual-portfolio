# Netlify build settings — every push to main rebuilds and redeploys the site.
# The project form (/project/) uses Netlify Forms: Forms → Submission notifications sends each message by email.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# Long-lived caching for hashed build assets and optimised media.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
